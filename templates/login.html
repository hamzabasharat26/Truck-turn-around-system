<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Truck TA System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="sidebar-header" style="padding-bottom: 0; border: 0; justify-content: center; display: flex; align-items: center; gap: 0.75rem;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-container"><path d="M22 8.7c0-.9-1-1.4-2.1-.9l-6.1 2.9c-.8.4-1.9.4-2.8 0L4.9 7.8c-1.1-.5-2.1 0-2.1.9v6.5c0 .9 1 1.4 2.1.9l6.1-2.9c.8-.4 1.9.4 2.8 0l6.1 2.9c1.1.5 2.1 0 2.1-.9V8.7Z"/><path d="m21.9 16.2-6.1-2.9c-.8-.4-1.9-.4-2.8 0L6.9 16.2c-1.1.5-2.1 0-2.1-.9v-6.5c0-.9 1-1.4 2.1-.9l6.1 2.9c.8.4 1.9.4 2.8 0l6.1-2.9c1.1-.5 2.1 0 2.1.9v6.5c0 .9-1 1.4-2.1.9Z"/></svg>
                <span style="font-size: 1.5rem; font-weight: 600; color: #fff;">Truck TA System</span>
            </div>
            
            <h1 class="login-title">- Login -</h1>
            <p class="login-subtitle">Please log in to access the dashboard</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                <div class="login-flash-messages">
                {% for category, message in messages %}
                  <div class="flash-login {{ category }}">{{ message }}</div>
                {% endfor %}
                </div>
              {% endif %}
            {% endwith %}

            <form class="admin-form" method="POST" action="{{ url_for('login') }}" style="margin-top: 1.5rem;">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="button login-button-center">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
